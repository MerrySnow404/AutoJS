// Injects the AutoJS MCP mod (and the KubeJS it requires) into the JEI Editor
// development client, without touching targets/neoforge-1.21.1/run/mods or any
// tracked file in that repository.
//
// Usage (from D:/work/JEI Editor/targets/neoforge-1.21.1):
//   gradlew.bat runClient --console plain --init-script D:/work/AutoJS/.autojs-scratch/jei-autojs.init.gradle
//
// Both jars come from AutoJS/.autojs-scratch/jars, so the JEI Editor run/mods test
// pack is never modified. KubeJS is the run/mods copy (it is shipped there as
// *.disabled, which FML's mods-folder scan ignores), copied under a .jar name.
def autojsJars = [
        'D:/work/AutoJS/.autojs-scratch/jars/AutoJS-neoforge-1.21.1-1.0.0.jar',
        'D:/work/AutoJS/.autojs-scratch/jars/kubejs-2101.7.2-build.377.jar',
]

gradle.projectsEvaluated {
    def target = gradle.rootProject
    autojsJars.each { path ->
        def file = new File(path)
        if (!file.isFile()) {
            throw new GradleException("AutoJS injection: missing jar ${file}")
        }
        target.dependencies.add('runtimeOnly', target.files(file))
    }
    target.logger.lifecycle('AutoJS injection: added {} to the runtime classpath', autojsJars.join(', '))
}
