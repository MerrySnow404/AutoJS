neoforge_261_minecraft_version=26.1
neoforge_261_version=26.1.2.84
neoforge_261_version_range=[26.1,)

# The script engine AutoJS embeds so that KubeJS can be optional, on the KubeJS
# 26.1 generation this Minecraft version uses. KubeJS depends on the same Rhino, so
# the two modes never load two of them: kubejs-neoforge 26.1.2-8.0.6's own
# neoforge.mods.toml requires rhino [2101.2.8-build.91,), and the righthand side of
# that range is exactly this artifact.
#
# Note the version number: the Rhino line is still named 2101 here, although the
# Minecraft generation is 26.1. The artifact is also the mod — see
# libs-maven/README.md.
rhino_version=2101.2.8-build.91

# KubeJS 26.1 APIs used by AutoJS. A soft dependency: compileOnly plus a matching
# runtimeOnly, so the mod loads without KubeJS while runServer still exercises the
# KubeJS mode. Its mandatory NeoForge range is [26.1.2.84,), which is what
# neoforge_261_version is.
kubejs_version=26.1.2-8.0.6
