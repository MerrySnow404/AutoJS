# KubeJS 2001 APIs used by AutoJS. A soft dependency: compileOnly plus a matching
# runtimeOnly, so the mod loads without KubeJS while runClient/runServer still
# exercise the KubeJS mode.
kubejs_version=2001.6.5-build.26
