fabric_minecraft_version=1.20.1
minecraft_version_range=>=1.20.1 <1.21
fabric_loader_version=0.16.14
fabric_api_version=0.92.11+1.20.1

# The script engine AutoJS embeds so that KubeJS can be optional, on the KubeJS
# 2001 generation this Minecraft version uses. KubeJS depends on the same Rhino,
# so the two modes never load two of them.
#
# On Fabric the artifact that carries both the Rhino classes and the `rhino` mod
# identity is `rhino-fabric`; the plain `rhino` artifact is KubeJS's own
# architectury-common build output and has no fabric.mod.json at all. Both are
# the same class set (checked with `unzip -l`), so this target uses only the
# loader-suffixed one.
rhino_version=2001.2.2-build.17
rhino_version_range=>=2001.2.2-build.1

# KubeJS 2001 APIs used by AutoJS. A soft dependency: compileOnly plus a matching
# runtimeOnly, so the mod loads without KubeJS while runClient/runServer still
# exercise the KubeJS mode.
kubejs_version=2001.6.5-build.26

# KubeJS's own runtime dependency on Fabric, which AutoJS never names. Added so
# runClient/runServer load KubeJS at all.
architectury_version=9.1.12
