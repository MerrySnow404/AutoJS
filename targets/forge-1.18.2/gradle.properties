forge_minecraft_version=1.18.2
forge_version=40.2.21
minecraft_version_range=[1.18.2,1.19)
forge_version_range=[40,)
forge_loader_version_range=[40,)

# Rhino, the script engine AutoJS embeds so that KubeJS can be optional, on the KubeJS
# 1802 generation this Minecraft version uses.
#
# Two things about these coordinates are 1802 rather than 1902:
#
# - Modrinth maven addresses an artifact by its project's *file id*, not by an artifact
#   version, so N59eFKIq below is a file id. The mod version it resolves to is
#   1802.2.1-build.255, and that is what the version range in mods.toml is written against.
# - This generation publishes the mod and the library as one jar: `rhino-N59eFKIq.jar`
#   carries the Rhino classes *and* a META-INF/mods.toml with modId "rhino". 1902 splits
#   them into a plain `rhino` library and a `rhino-forge` mod, which is why this target
#   declares one artifact where that one declares two.
rhino_version=N59eFKIq

# KubeJS 1802 APIs used by AutoJS (1802.5.5-build.569, same file-id addressing as Rhino).
# A soft dependency: compileOnly plus a matching runtimeOnly, so the mod loads without
# KubeJS while the KubeJS-backed engine is still authored against real APIs.
kubejs_version=MngQb49Q

# KubeJS 1802's own mandatory runtime dependency: its mods.toml requires architectury
# `[4.7.78,)`. No AutoJS source names it; it is here so a game with KubeJS installed has
# it. The 4.x line on maven.architectury.dev is the 1.18.2 one (5.x is 1.19.2, 9.x is
# 1.20.1), and 4.11.89 is the highest release on it.
architectury_version=4.11.89
