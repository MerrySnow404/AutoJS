plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). Everything without a
// confirmed version difference lives there, so its sources are compiled into
// this target by source-set sharing. Its shared resources directory is wired in
// by gradle/target-conventions/publish.gradle.
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        // This target's version differences are registered here: exclude one
        // path per common file that this target replaces with its own
        // implementation, for example
        //     exclude 'com/example/network/ChunkPacket.java'
        // Everything not listed here stays shared with every other target.
        //
        // Script-engine axis. common/ only defines the engine SPI
        // (cc.sighs.autojs.engine.ScriptEngine, EngineSideBackend); every implementation of it
        // that reaches a KubeJS or Rhino type is target-owned, because both changed by leaps
        // between the KubeJS generations AutoJS supports: KubeJS 2101 has KubeJSContext,
        // KubeJSContextFactory and the plugin interface that 1802/1902/2001 do not, and Rhino
        // only grows ContextFactory, type.TypeInfo and util.wrap at 2101. The paths below are
        // this target's replacements; each stays as the record of a confirmed difference and
        // keeps a stray copy out of the generated source set if one ever reappears in common.
        exclude 'cc/sighs/autojs/neoforge/AbstractKubeJSSideBackend.java'
        exclude 'cc/sighs/autojs/neoforge/KubeJSConsole.java'
        exclude 'cc/sighs/autojs/neoforge/KubeJSEvaluator.java'
        exclude 'cc/sighs/autojs/neoforge/KubeJSScriptManagers.java'
        exclude 'cc/sighs/autojs/neoforge/KubeJSSideBackend.java'
        exclude 'cc/sighs/autojs/neoforge/AutoJSKubeJSPlugin.java'
        exclude 'cc/sighs/autojs/neoforge/AutoJSUnrestricted.java'
        exclude 'cc/sighs/autojs/neoforge/backend/RhinoSideBackend.java'
        exclude 'cc/sighs/autojs/neoforge/client/ClientEvalBackend.java'
        exclude 'cc/sighs/autojs/neoforge/eval/ScriptValue.java'
        exclude 'cc/sighs/autojs/neoforge/kubejs/KubeJSIntegration.java'
        exclude 'cc/sighs/autojs/neoforge/rhino/RhinoBindings.java'
        exclude 'cc/sighs/autojs/neoforge/rhino/RhinoRuntime.java'
        exclude 'cc/sighs/autojs/neoforge/server/ServerEvalBackend.java'
        exclude 'cc/sighs/autojs/neoforge/tools/KubeJSLogTool.java'
        exclude 'cc/sighs/autojs/neoforge/unrestricted/UnrestrictedAccess.java'
        exclude 'cc/sighs/autojs/neoforge/unrestricted/UnrestrictedContextFactory.java'
        exclude 'cc/sighs/autojs/neoforge/unrestricted/UnrestrictedKubeJSContext.java'
        exclude 'cc/sighs/autojs/neoforge/unrestricted/UnrestrictedKubeJSServerContext.java'
        exclude 'cc/sighs/autojs/neoforge/unrestricted/UnrestrictedPathWrappers.java'

        // Loader axis. Same rule, one step further out: the mod constructor, its client half and
        // the engine-selection facade are the only files whose NeoForge FML usage is their whole
        // reason to exist.
        exclude 'cc/sighs/autojs/neoforge/AutoJSBackends.java'
        exclude 'cc/sighs/autojs/neoforge/AutoJSNeoForge121.java'
        exclude 'cc/sighs/autojs/neoforge/AutoJSNeoForgeClient.java'

        // Minecraft API axis. The shared scripts no longer name a call that moved between 1.18.2
        // and 1.21.1: they ask cc.sighs.autojs.mc.McApi for the three interfaces a target
        // implements, and this target's implementations are the three files below. AutoJSInput
        // moves with them because the class it extends, net.minecraft.client.player.Input, is
        // itself what changed: its tick takes one argument at 1.18.2 and two from 1.19, so only
        // the target that has this Input can write the subclass the client bridge drives.
        //
        // As above, these lines are the record of a confirmed difference: the implementations
        // live in this target, and listing them keeps a stray shared copy out of the generated
        // source set if one ever reappears in common.
        exclude 'cc/sighs/autojs/neoforge/client/AutoJSInput.java'
        exclude 'cc/sighs/autojs/neoforge/mc/AutoJSClient.java'
        exclude 'cc/sighs/autojs/neoforge/mc/AutoJSLoader.java'
        exclude 'cc/sighs/autojs/neoforge/mc/AutoJSVanilla.java'
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar', Jar).configure {
    dependsOn 'prepareCommonSources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Rhino, the script engine AutoJS embeds so that KubeJS can be optional. Always on the classpath: it is
    // what the standalone kernel runs on, and neoforge.mods.toml declares it a required mod dependency.
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    // KubeJS APIs used by AutoJS. compileOnly because KubeJS is a soft dependency: the mod has to load and run
    // without it. runtimeOnly puts it back on the dev runtime classpath, so runClient/runServer still exercise
    // the KubeJS mode, which is the mode that has to keep behaving exactly as before.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_121_minecraft_version,
            neoforge_version      : neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

apply from: file('../../gradle/target-conventions/publish.gradle')
