// Standalone build for the shared source tree.
//
// common/ holds every piece of code that has no confirmed loader/version
// difference: the MCP endpoint, the side registry and the SPI a target
// implements (side/, engine/). It MAY reference Minecraft and NeoForge types —
// the split rule is "a confirmed version difference", not "platform
// independence" — but it no longer references any KubeJS or Rhino type: script
// engines are generation-bound, so each one lives in the target that has that
// generation (see targets/neoforge-1.21.1/build.gradle). It still compiles
// against the same NeoForge 1.21.1 classpath as targets/neoforge-1.21.1, so it
// can be built and tested on its own:
//
//     gradlew -p common build
//
// Targets do NOT include this as a Gradle subproject. They compile these same
// sources into their own source set through `prepareCommonSources` (see each
// target's build.gradle), and that task is also where a target excludes the
// common files that do have a version difference.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_121_version
}

repositories {
    mavenCentral()
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Rhino and KubeJS are kept on this build's classpath although no source in
    // common/ references either any more (the script engines moved into the
    // targets). They stay so that `gradlew -p common build` compiles against
    // exactly the classpath a target does — which is what makes "does this file
    // have a confirmed version difference?" answerable by a plain compile here —
    // and so a future shared file may use them if it truly has none.
    //
    // Rhino, on the same version KubeJS depends on, so a KubeJS mode never loads
    // two Rhinos.
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    // KubeJS APIs. The target turns this into a soft dependency at packaging time
    // (compileOnly + runtimeOnly there).
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
